
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Agoho Retreat & Beach</title>

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="{% static 'images/agoho_logo.png' %}"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="{% static 'images/agoho_logo.png' %}"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="{% static 'images/agoho_logo.png' %}"
    >

    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/agoho_logo.png' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'images/agoho_logo.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/agoho_logo.png' %}">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           ROOT
        ========================================================= */

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #eff6ff;

            --navy: #0f172a;
            --navy-light: #1e293b;

            --cyan: #22d3ee;

            --bg: #f8fafc;
            --white: #ffffff;

            --text-main: #0f172a;
            --text-muted: #64748b;

            --border: #e2e8f0;

            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #b91c1c;

            --success: #16a34a;
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            min-height: 100%;
        }


        /* =========================================================
           BODY
        ========================================================= */

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            font-family: "Plus Jakarta Sans", sans-serif;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(34, 211, 238, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(37, 99, 235, 0.20),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #0b192c 0%,
                    #172554 48%,
                    #1d4ed8 100%
                );

            color: var(--text-main);
        }


        /* =========================================================
           LOGIN CONTAINER
        ========================================================= */

        .login-container {
            width: 100%;
            max-width: 450px;

            position: relative;
            z-index: 2;
        }


        /* =========================================================
           LOGIN CARD
        ========================================================= */

        .login-card {
            width: 100%;

            padding: 42px;

            background: rgba(255, 255, 255, 0.97);

            border: 1px solid rgba(255, 255, 255, 0.55);

            border-radius: 18px;

            box-shadow:
                0 25px 70px rgba(2, 8, 23, 0.30),
                0 8px 25px rgba(2, 8, 23, 0.10);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }


        /* =========================================================
           BRAND
        ========================================================= */

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }


        .logo-badge {
            width: 76px;
            height: 76px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;

            border: 1px solid var(--border);

            border-radius: 16px;

            box-shadow:
                0 8px 20px rgba(15, 23, 42, 0.08);
        }


        .logo-badge img {
            width: 58px;
            height: 58px;

            object-fit: contain;

            display: block;
        }


        .brand-title {
            color: var(--navy);

            font-size: 23px;
            line-height: 1.3;

            font-weight: 800;

            letter-spacing: -0.5px;
        }


        .brand-subtitle {
            margin-top: 7px;

            color: var(--text-muted);

            font-size: 13px;
            line-height: 1.5;

            font-weight: 500;
        }


        /* =========================================================
           ERROR
        ========================================================= */

        .error-alert {
            display: flex;
            align-items: flex-start;

            gap: 10px;

            margin-bottom: 24px;

            padding: 13px 14px;

            background: var(--error-bg);

            border: 1px solid var(--error-border);

            border-radius: 10px;

            color: var(--error-text);

            font-size: 13px;
            line-height: 1.5;

            font-weight: 600;
        }


        .error-alert svg {
            flex-shrink: 0;

            width: 18px;
            height: 18px;

            margin-top: 1px;
        }


        /* =========================================================
           FORM
        ========================================================= */

        .login-form {
            width: 100%;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 11px;
            line-height: 1.4;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 0.7px;
        }


        /* =========================================================
           INPUT WRAPPER
        ========================================================= */

        .input-wrapper {
            position: relative;

            width: 100%;
        }


        /* =========================================================
           INPUT SVG ICON
        ========================================================= */

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            width: 20px;
            height: 20px;

            color: #64748b;

            transform: translateY(-50%);

            pointer-events: none;

            z-index: 2;

            transition: color 0.2s ease;
        }


        .input-wrapper:focus-within .input-icon {
            color: var(--primary);
        }


        /* =========================================================
           INPUT
        ========================================================= */

        .input-wrapper input {
            width: 100%;
            height: 50px;

            padding: 0 15px 0 46px;

            background: #ffffff;

            border: 1.5px solid var(--border);

            border-radius: 10px;

            outline: none;

            color: var(--text-main);

            font-family: inherit;

            font-size: 14px;

            font-weight: 500;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        .input-wrapper input::placeholder {
            color: #94a3b8;

            font-weight: 400;
        }


        .input-wrapper input:hover {
            border-color: #cbd5e1;
        }


        .input-wrapper input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }


        /* =========================================================
           PASSWORD INPUT
        ========================================================= */

        .input-wrapper input[type="password"],
        .input-wrapper input#password {
            padding-right: 72px;
        }


        /* =========================================================
           SHOW / HIDE PASSWORD
        ========================================================= */

        .toggle-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            padding: 6px 4px;

            border: none;

            background: transparent;

            color: var(--primary);

            font-family: inherit;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            z-index: 3;

            transition: color 0.2s ease;
        }


        .toggle-password:hover {
            color: var(--primary-dark);
        }


        .toggle-password:focus {
            outline: none;

            color: var(--primary-dark);

            text-decoration: underline;

            text-underline-offset: 3px;
        }


        /* =========================================================
           LOGIN BUTTON
        ========================================================= */

        .login-button {
            width: 100%;
            height: 50px;

            margin-top: 4px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--primary-dark)
            );

            color: #ffffff;

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(37, 99, 235, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }


        .login-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 12px 24px rgba(37, 99, 235, 0.28);

            filter: brightness(1.03);
        }


        .login-button:active {
            transform: translateY(0);

            box-shadow:
                0 6px 14px rgba(37, 99, 235, 0.20);
        }


        .login-button:focus {
            outline: none;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.15),
                0 8px 18px rgba(37, 99, 235, 0.22);
        }


        /* =========================================================
           APK DOWNLOAD
        ========================================================= */

        .apk-download {
            width: 100%;
            height: 48px;

            margin-top: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            border: 1px solid #bae6fd;

            border-radius: 10px;

            background: #f0f9ff;

            color: #0369a1;

            font-family: inherit;

            font-size: 13px;

            font-weight: 800;

            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .apk-download:hover {
            background: #e0f2fe;

            border-color: #7dd3fc;

            color: #075985;

            transform: translateY(-1px);

            box-shadow:
                0 8px 18px rgba(14, 165, 233, 0.12);
        }


        .apk-download:active {
            transform: translateY(0);

            box-shadow: none;
        }


        .apk-download:focus {
            outline: none;

            box-shadow:
                0 0 0 3px rgba(14, 165, 233, 0.14);
        }


        .apk-download svg {
            width: 19px;
            height: 19px;

            flex-shrink: 0;
        }


        /* =========================================================
           APK NOTE
        ========================================================= */

        .apk-note {
            margin-top: 9px;

            color: #94a3b8;

            font-size: 10px;

            line-height: 1.5;

            font-weight: 500;

            text-align: center;
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        .login-footer {
            margin-top: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            color: #64748b;

            font-size: 11px;

            line-height: 1.5;

            font-weight: 600;

            text-align: center;
        }


        .secure-dot {
            width: 7px;
            height: 7px;

            flex-shrink: 0;

            border-radius: 50%;

            background: var(--success);

            box-shadow:
                0 0 0 3px rgba(22, 163, 74, 0.10);
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .login-card {
                padding: 34px 28px;
            }

            .brand-title {
                font-size: 21px;
            }
        }


        @media (max-width: 420px) {

            body {
                padding: 15px;
            }

            .login-card {
                padding: 30px 20px;

                border-radius: 15px;
            }

            .logo-badge {
                width: 68px;
                height: 68px;
            }

            .logo-badge img {
                width: 52px;
                height: 52px;
            }

            .brand-title {
                font-size: 19px;
            }

            .brand-subtitle {
                font-size: 12px;
            }

            .input-wrapper input {
                height: 48px;
            }

            .login-button {
                height: 48px;
            }

            .apk-download {
                height: 48px;
            }
        }

    </style>
</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <!-- =====================================================
                 BRAND HEADER
            ====================================================== -->

            <div class="brand-header">

                <div class="logo-badge">

                    <img
                        src="{% static 'images/agoho_logo.png' %}"
                        alt="Agoho Retreat & Beach Logo"
                    >

                </div>

                <h1 class="brand-title">
                    Agoho Retreat & Beach
                </h1>

                <p class="brand-subtitle">
                    Admin Portal Sign In
                </p>

            </div>


            <!-- =====================================================
                 ERROR MESSAGE
            ====================================================== -->

            {% if error %}

                <div class="error-alert">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="9"
                            stroke="currentColor"
                            stroke-width="1.8"
                        />

                        <path
                            d="M12 8V12"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />

                        <circle
                            cx="12"
                            cy="16"
                            r="1"
                            fill="currentColor"
                        />

                    </svg>

                    <span>
                        {{ error }}
                    </span>

                </div>

            {% endif %}


            <!-- =====================================================
                 LOGIN FORM
            ====================================================== -->

            <form
                method="POST"
                class="login-form"
                autocomplete="on"
            >

                {% csrf_token %}


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <!-- User SVG -->

                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >

                            <path
                                d="M20 21C20 17.6863 17.3137 15 14 15H10C6.68629 15 4 17.6863 4 21"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                            <circle
                                cx="12"
                                cy="7"
                                r="4"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                        </svg>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <!-- Lock SVG -->

                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >

                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="11"
                                rx="2"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                            <path
                                d="M8 10V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V10"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                            <circle
                                cx="12"
                                cy="15.5"
                                r="1"
                                fill="currentColor"
                            />

                            <path
                                d="M12 16.5V18"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                        </svg>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePasswordVisibility()"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>


                <!-- APK DOWNLOAD -->

                <a
                    href="{% static 'downloads/agoho-mobile-app.apk' %}"
                    class="apk-download"
                    download="agoho-retreat.apk"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <path
                            d="M12 3V15"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />

                        <path
                            d="M7 11L12 16L17 11"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M5 21H19"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />

                    </svg>

                    Download Android App

                </a>


                <p class="apk-note">
                    Android application · APK installation package
                </p>

            </form>


            <!-- =====================================================
                 FOOTER
            ====================================================== -->

            <div class="login-footer">

                <span class="secure-dot"></span>

                <span>
                    Secure Portal · Authorized Personnel Only
                </span>

            </div>

        </div>

    </div>


    <!-- =========================================================
         PASSWORD VISIBILITY SCRIPT
    ========================================================= -->

    <script>

        function togglePasswordVisibility() {

            const passwordInput =
                document.getElementById("password");

            const toggleButton =
                document.querySelector(".toggle-password");


            if (!passwordInput || !toggleButton) {
                return;
            }


            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                toggleButton.textContent = "Hide";

                toggleButton.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                passwordInput.type = "password";

                toggleButton.textContent = "Show";

                toggleButton.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }

    </script>

</body>
</html>
